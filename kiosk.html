/* overlay handled by #bg-layer */

/* ── gold shimmer keyframes ── */
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.75}}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.55),inset 0 0 12px rgba(255,215,0,.1)}
  50%{box-shadow:0 0 0 6px rgba(255,215,0,0),inset 0 0 18px rgba(255,215,0,.25)}
}
@keyframes glowText{
  0%,100%{text-shadow:0 0 6px rgba(255,215,0,.6),0 0 12px rgba(255,215,0,.3)}
  50%{text-shadow:0 0 10px rgba(255,215,0,.9),0 0 20px rgba(255,215,0,.5)}
}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

.app{display:flex;flex-direction:column;height:100vh}

/* ═══════════════════════════════════
   HEADER
═══════════════════════════════════ */
.header{
  background:rgba(5,10,20,.20);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--gold-d);
  padding:10px 28px 8px;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:16px;
  position:relative;
}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* clock block */
.clock-blk{text-align:right}
#clock{font-family:var(--fd);font-size:clamp(38px,5.2vw,68px);font-weight:700;
  color:var(--gold);letter-spacing:3px;line-height:1;font-variant-numeric:tabular-nums}
#date-sub{font-size:12px;color:#FFD700;margin-top:3px;letter-spacing:.5px;font-weight:600}

/* title block */
.title-blk{text-align:center}

/* ── Crown logo ── */
.crown-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:2px}
.crown-wrap{position:relative}
.crown-wrap::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:160px;height:100px;
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(255,215,0,.55) 0%,
    rgba(201,162,39,.35) 30%,
    rgba(201,100,0,.15) 60%,
    transparent 75%
  );
  filter:blur(10px);
  z-index:0;
  animation:glowPulse 3s ease-in-out infinite;
}
.crown-img{
  width:auto;height:100px;object-fit:contain;
  position:relative;z-index:1;
  filter:drop-shadow(0 0 16px rgba(255,215,0,.7))
         drop-shadow(0 0 6px rgba(201,162,39,.9))
         drop-shadow(0 3px 6px rgba(0,0,0,.7));
  animation:shimmer 4s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
}
.yechi{font-family:var(--fd);font-size:clamp(14px,2vw,20px);color:#FFD700;
  font-weight:700;letter-spacing:1px;line-height:1.2}
.mashiach{font-family:var(--fd);font-size:clamp(22px,3.2vw,40px);font-weight:900;color:#FFD700;letter-spacing:2px;line-height:1.1;animation:shimmer 4s ease-in-out infinite;text-shadow:0 0 20px rgba(255,215,0,.6)}
.shul-name{font-size:11px;color:#FFD700;letter-spacing:1.5px;margin-top:3px;font-weight:600;opacity:.9}
.yechi-full{font-family:var(--fd);font-size:clamp(24px,3.4vw,46px);font-weight:900;color:#FFE658;letter-spacing:1.8px;line-height:1.15;text-align:center;text-shadow:0 1px 0 #6b4f00,0 2px 0 rgba(0,0,0,.6),0 0 1px rgba(255,255,255,.5),0 0 14px rgba(255,215,0,.45);white-space:nowrap}
#heb-date-title{font-size:14px;color:var(--text);margin-top:2px}

/* parasha block */
.parasha-blk{text-align:left}
.parasha-lbl{font-size:10px;color:#FFD700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;font-weight:600}
#parasha{font-family:var(--fd);font-size:clamp(18px,2.5vw,28px);color:#FFD700;font-weight:700;line-height:1.2;text-shadow:0 0 10px rgba(255,215,0,.4)}
.haftarah-lbl{font-size:11px;color:#FFD700;letter-spacing:1.5px;font-weight:600;margin-top:6px;opacity:.85}
#haftarah{font-family:var(--fd);font-size:clamp(12px,1.4vw,16px);color:#FFD700;font-weight:600;line-height:1.3;opacity:.95;margin-top:1px}
.yeshiva-logo-center{display:none}
.corner-logo{position:fixed;left:18px;bottom:8px;height:64px;aspect-ratio:151/160;
  background:var(--yeshiva-logo) center/contain no-repeat;
  filter:drop-shadow(0 0 8px rgba(255,215,0,.3));z-index:50;pointer-events:none}
.corner-logo-right{position:fixed;right:18px;bottom:8px;z-index:50;pointer-events:none;
  height:64px;width:64px;
  background-image:var(--chabad-logo);background-size:contain;background-position:center;background-repeat:no-repeat;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.5)) drop-shadow(0 0 10px rgba(255,215,0,.25))}
#heb-date-right{font-size:13px;color:#FFD700;margin-top:3px;opacity:.85}

/* gold ornament divider */
.ornament{display:flex;align-items:center;gap:8px;justify-content:center;margin:4px 0 2px}
.ornament span{color:var(--gold);font-size:14px;opacity:.6}
.ornament::before,.ornament::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d))}

/* ═══════════════════════════════════
   MAIN GRID
═══════════════════════════════════ */
.main{flex:1;display:grid;grid-template-columns:290px 1fr 265px;gap:0;min-height:0}

/* ── ZMANIM (right col since RTL) ── */
.col-zmanim{background:rgba(5,10,20,.20);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--gold-d);
  padding:14px 12px;display:flex;flex-direction:column;gap:0;overflow:hidden}
.col-title{font-family:var(--fd);font-size:15px;color:var(--gold);font-weight:700;
  text-align:center;padding-bottom:10px;margin-bottom:8px;letter-spacing:1px;
  border-bottom:1px solid var(--gold-d);position:relative}

let haftarahLocked=false; // נקבע ל-true כש-Hebcal מספק הפטרה, כדי שלא תידרס מהשרת
const HAF_BOOKS={
 'Genesis':'בראשית','Exodus':'שמות','Leviticus':'ויקרא','Numbers':'במדבר','Deuteronomy':'דברים',
 'Joshua':'יהושע','Judges':'שופטים',
 'I Samuel':'שמואל א','II Samuel':'שמואל ב',
 'I Kings':'מלכים א','II Kings':'מלכים ב',
 'Isaiah':'ישעיהו','Jeremiah':'ירמיהו','Ezekiel':'יחזקאל',
 'Hosea':'הושע','Joel':'יואל','Amos':'עמוס','Obadiah':'עובדיה','Jonah':'יונה',
 'Micah':'מיכה','Nahum':'נחום','Habakkuk':'חבקוק','Zephaniah':'צפניה',
 'Haggai':'חגי','Zechariah':'זכריה','Malachi':'מלאכי',
 'Psalms':'תהילים','Ezra':'עזרא','Nehemiah':'נחמיה',
 'I Chronicles':'דברי הימים א','II Chronicles':'דברי הימים ב'
};
const HAF_SPECIAL={
 'Rosh Chodesh':'ראש חודש','Shabbat Rosh Chodesh':'שבת ראש חודש','Machar Chodesh':'מחר חודש',
 'Shabbat HaGadol':'שבת הגדול','Shabbat Shuva':'שבת שובה','Shabbat Shekalim':'שבת שקלים',
 'Shabbat Zachor':'שבת זכור','Shabbat Parah':'שבת פרה','Shabbat HaChodesh':'שבת החודש',
 'Chanukah':'חנוכה'
};
function num2heb(n){
  n=parseInt(n,10);
  if(!n||n<0) return String(n);
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const huns=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s=(huns[Math.floor(n/100)]||'');
  const rem=n%100;
  if(rem===15) s+='טו';
  else if(rem===16) s+='טז';
  else { s+=(tens[Math.floor(rem/10)]||''); s+=(ones[rem%10]||''); }
  if(s.length===1) s+='׳'; else s=s.slice(0,-1)+'״'+s.slice(-1);
  return s;
}
function rangeToHeb(r){
  const part=p=>{const cv=p.split(':');return cv.length===2?num2heb(cv[0])+':'+num2heb(cv[1]):num2heb(cv[0]);};
  const dash=r.split('-');
  if(dash.length===2){
    const a=part(dash[0].trim());
    const bRaw=dash[1].trim();
    const b=bRaw.indexOf(':')>=0?part(bRaw):num2heb(bRaw);
    return a+'–'+b;
  }
  return part(r.trim());
}
function refToHeb(ref){ return ref.split(',').map(r=>rangeToHeb(r.trim())).join(', '); }
function haftarahToHebrew(eng){
  if(!eng) return '';
  return eng.split(/\s*;\s*/).map(seg=>{
    const parts=seg.split('|');
    const main=parts[0].trim();
    const note=parts[1]?parts[1].trim():'';
    const m=main.match(/^((?:I{1,3}|II|[12])\s+)?([A-Za-z][A-Za-z' ]*?)\s+([\d][\d:,\s\-]*\d|\d)$/);
    let heb=main;
    if(m){
      const bookEng=((m[1]||'')+m[2]).replace(/\s+/g,' ').trim();
      const book=HAF_BOOKS[bookEng]||HAF_BOOKS[m[2].trim()]||m[2].trim();
      heb=book+' '+refToHeb(m[3].replace(/\s+/g,''));
    }
    if(note) heb+=' — '+(HAF_SPECIAL[note]||note);
    return heb;
  }).join('; ');
}

// FETCH DATA — מהשרת המקומי
// ════════════════════════════════════════════════════════
async function fetchData(){
  try{
    const r=await fetch(DATA_URL,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d){
      if(typeof d.torah==="string"&&d.torah.trim()) st.torah=d.torah;
      if(typeof d.hayomYom==="string") st.hayomYom=d.hayomYom;
      if(typeof d.hayomYomDate==="string") st.hayomYomDate=d.hayomYomDate;
      // המקור (URL) של היום יום — מכיל את התאריך העברי, נחלץ ממנו לתצוגה
      if(typeof d.hayomYomSource==="string") st.hayomYomSource=d.hayomYomSource;
      if(typeof d.pithgam==="string") st.pithgam=d.pithgam;
      if(typeof d.videoUrl==="string") st.videoUrl=d.videoUrl;
      if(typeof d.videoTitle==="string") st.videoTitle=d.videoTitle;
      if(Array.isArray(d.playlist)) st.playlist=d.playlist;
      if(d.prayers) st.prayers={...D_PRAY,...d.prayers};
      if(Array.isArray(d.birthdays)) st.birthdays=d.birthdays;
      st.videoOffBeforePrayer = !!d.videoOffBeforePrayer;
      st.viewingWindows = Array.isArray(d.viewingWindows) ? d.viewingWindows : [];
      if(Array.isArray(d.items)) st.items=d.items;
      if(Array.isArray(d.donors)) st.donors=d.donors;
      // זמנים מהשרת (chabad.org RSS) — אם קיימים, מחליפים את Hebcal
      if(d.zmanim && Object.keys(d.zmanim).length){
        st.zmanim={...st.zmanim,...d.zmanim};
        st.zmanimSource="chabad";
      }
      // אירועי הדלקת נרות וצאת השבת מ-chabad.org ICS
      if(Array.isArray(d.candleEvents)) st.candleEvents=d.candleEvents;
      // לימוד יומי מ-chabad.org.il (7 מקורות)
      if(d.dailyLearning && typeof d.dailyLearning==='object') st.dailyLearning=d.dailyLearning;
      // overrides ידניים מהמנהל
      if(d.dailyLearningOverrides && typeof d.dailyLearningOverrides==='object') st.dailyLearningOverrides=d.dailyLearningOverrides;
      // הפטרה — רק כגיבוי. אם Hebcal (לוח א"י) כבר סיפק, לא דורסים כדי לשמור התאמה לפרשה.
      if(typeof d.haftarah==='string' && !haftarahLocked) st.haftarah=d.haftarah;
      // תיבות חסות
      if(d.sponsorBox && typeof d.sponsorBox==='object') st.sponsorBox=d.sponsorBox;
      if(Array.isArray(d.gallerySelected)) st.gallerySelected=d.gallerySelected;
      if(Array.isArray(d.galleryCustom)) st.galleryCustom=d.galleryCustom;
      if(d.galleryInterval) st.galleryInterval=d.galleryInterval;
      if(d.memorialBox && typeof d.memorialBox==='object') st.memorialBox=d.memorialBox;
      if(d.sponsorDaily && typeof d.sponsorDaily==='object') st.sponsorDaily=d.sponsorDaily;
      if(d.sponsorWeekly && typeof d.sponsorWeekly==='object') st.sponsorWeekly=d.sponsorWeekly;
      if(d.sponsorScreen && typeof d.sponsorScreen==='object') st.sponsorScreen=d.sponsorScreen;
      // אילו זמנים להציג (מועדפות מהממשק)
      if(d.zmanimVisible && typeof d.zmanimVisible==='object') st.zmanimVisible=d.zmanimVisible;
      if(d.learningVisible && typeof d.learningVisible==='object') st.learningVisible=d.learningVisible;
      if(d.sectionsVisible && typeof d.sectionsVisible==='object') st.sectionsVisible=d.sectionsVisible;
      if(d.hideToday && typeof d.hideToday==='object') st.hideToday=d.hideToday;
    }
    setStatus("online","מחובר");
    renderDynamic();
  }catch(e){
    console.error("data fetch:",e);
    setStatus("offline","⚠ ללא חיבור");
  }
}

// FETCH HEBCAL
// ════════════════════════════════════════════════════════
async function fetchHebcal(){
  const n=new Date();
  const ds=`${n.getFullYear()}-${(n.getMonth()+1).toString().padStart(2,"0")}-${n.getDate().toString().padStart(2,"0")}`;
  // זמנים: רק כ-fallback — אם chabad.org RSS כבר טעון, לא נדרוס
  try{const r=await fetch(`https://www.hebcal.com/zmanim?cfg=json&latitude=31.7683&longitude=35.2137&tzid=Asia%2FJerusalem&date=${ds}`);const d=await r.json();if(d.times && st.zmanimSource!=="chabad") st.zmanim={...d.times,...st.zmanim};}catch(e){}
  try{const r=await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${n.getFullYear()}&gm=${n.getMonth()+1}&gd=${n.getDate()}&g2h=1`);const d=await r.json();if(d.hebrew){st.hebDate=d.hebrew;} if(d.hd)st.hebDay=d.hd; if(d.hm)st.hebMonth=d.hm;}catch(e){}
  // פרשה + הפטרה מאותה קריאה — לוח ארץ ישראל (i=on) כדי שהשתיים תמיד תואמות.
  // בירושלים: שבת ו' ביוני 2026 = פרשת שלח (ולא בהעלותך של חו"ל), הפטרה: יהושע ב'.
  try{
    const r=await fetch(`https://www.hebcal.com/shabbat?cfg=json&latitude=31.7683&longitude=35.2137&tzid=Asia%2FJerusalem&i=on&M=on&lg=he&leyning=on`);
    const d=await r.json();
    const p=d.items?.find(i=>i.category==="parashat");
    if(p){
      st.parasha=p.hebrew||p.title||"";
      const hafEng=p.leyning && p.leyning.haftarah;
      if(hafEng){ st.haftarah=haftarahToHebrew(hafEng); haftarahLocked=true; }
    }
  }catch(e){}
  renderDynamic();
}

function fmtTime(iso){
  if(!iso) return "—";
  try{return new Date(iso).toLocaleTimeString("en-GB",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit",hour12:false});}catch{return "—";}
}

function renderClock(){
  const t=new Date();
  // השעון תמיד בשעון ישראל — לא תלוי בשעון/אזור-הזמן של מסך הקיוסק
  document.getElementById("clock").textContent=t.toLocaleTimeString("en-GB",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  // Show Hebrew date + day of week in Hebrew
  const wd=t.toLocaleDateString("he-IL",{weekday:"long",timeZone:"Asia/Jerusalem"});
  const heDate=st.hebDate||"";
  document.getElementById("date-sub").textContent=heDate?`${wd} • ${heDate}`:wd;
  renderRoshChodesh();
  renderPrayers();
}

function renderZmanim(){
  const now=Date.now();
  // סנן לפי העדפות תצוגה — אם לא הוגדר, מציג הכל
  const visible = ZMANIM_DEFS.filter(z=>(!st.zmanimVisible || st.zmanimVisible[z.key]!==false) && !hiddenToday('z:'+z.key));
  let nextI=-1;
  visible.forEach((z,i)=>{
    if(nextI===-1&&st.zmanim[z.key]&&new Date(st.zmanim[z.key]).getTime()>now) nextI=i;
  });
  const html=visible.map((z,i)=>{
    const past=st.zmanim[z.key]&&new Date(st.zmanim[z.key]).getTime()<now;
    const cls=i===nextI?"zman-row next":past?"zman-row past":"zman-row";
    return `<div class="${cls}">
      <span class="zman-name">${z.label}</span>
      <span class="zman-time">${fmtTime(st.zmanim[z.key])}</span>
    </div>`;
  }).join("");
  document.getElementById("zmanim-list").innerHTML=html;
}

function isRoshChodeshPeriod(){
  // ראש חודש פעיל מכ"ט בחודש 19:30 עד ערבית של ליל ב' בחודש
  if(!st.hebDay || !st.hebMonth) return false;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const hday = Number(st.hebDay);

  // כ"ט — מ-19:30 בלבד
  if(hday === 29 && nowMin >= 19*60+30) return true;
  // ל' — כל היום
  if(hday === 30) return true;
  // א' — עד זמן ערבית
  if(hday === 1){
    const maariv = st.prayers && st.prayers.maariv;
    if(maariv && /^\d{1,2}:\d{2}$/.test(maariv)){
      const [hh,mm] = maariv.split(":").map(Number);
      const maarMin = hh*60+mm;
      if(nowMin < maarMin) return true;
    } else {
      return true; // אם אין ערבית מוגדרת — מציג כל היום
    }
  }
  return false;
}

function renderRoshChodesh(){
  const el = document.getElementById("rosh-chodesh-banner");
  if(!el) return;
  if(isRoshChodeshPeriod()){
    el.classList.add("visible");
  } else {
    el.classList.remove("visible");
  }
}

function renderPrayers(){
  const rc = isRoshChodeshPeriod();
  const html=PRAYER_DEFS.map(p=>{
    const v=st.prayers[p.key]||"—";
    const cls=p.special?"prayer special":"prayer";
    const showYaaleh = rc && ["shacharit","mincha","maariv"].includes(p.key);
    return `<div class="${cls}">
      <div class="prayer-name">${p.label}</div>
      <div class="prayer-time">${v||"—"}</div>
      ${showYaaleh ? '<div class="yaaleh visible">יַעֲלֶה וְיָבֹא</div>' : '<div class="yaaleh"></div>'}
    </div>`;
  }).join("");
  document.getElementById("prayers").innerHTML=html;
}

// תיבת חסות גנרית — מציג כותרת+תוכן אם יש תוכן
function renderBox(id, data){
  const el=document.getElementById(id); if(!el) return;
  const hasContent=data && data.enabled!==false && data.body && data.body.trim();
  if(!hasContent){ el.className='dedication-box empty'; el.innerHTML=''; return; }
  el.className='dedication-box';
  el.innerHTML=
    (data.title?`<div class="dedication-title">${esc(data.title)}</div>`:'')+
    `<div class="dedication-body">${esc(data.body)}</div>`;
}

// חסות המסך והמחשוב — רצועה קבועה רחבה בתחתית
function renderDonorStrip(){
  const strip = document.getElementById("donor-strip");
  const nameEl = document.getElementById("donor-name");
  const labelEls = strip ? strip.querySelectorAll(".donor-label") : [];

// הדלקת נרות וצאת השבת — מתחת לזמני יום, ללא אימוג'ים, בפונט תואם
function renderCandle(){
  const el=document.getElementById("candle-list");
  if(!el) return;
  // תצוגת הדלקת נרות/יציאת שבת רק מיום חמישי בשעה 19:00 ועד מוצאי שבת.
  // (ראשון–רביעי, וחמישי לפני 19:00 → מוסתר)
  const n=new Date();
  const dow=n.getDay();                 // 0=ראשון .. 4=חמישי, 5=שישי, 6=שבת
  const mins=n.getHours()*60+n.getMinutes();
  const windowOpen = (dow===4 && mins>=19*60) || dow===5 || dow===6;
  if(!windowOpen){ el.innerHTML=""; return; }
  const now=Date.now();
  const upcoming=(st.candleEvents||[]).filter(e=>new Date(e.iso).getTime()>=now-12*3600*1000);
  const nextCandle=upcoming.find(e=>e.type==='candle');
  const nextHavdalah=upcoming.find(e=>e.type==='havdalah');
  const rows=[];
  if(nextCandle){
    rows.push(`<div class="candle-row">
      <span class="candle-name">הדלקת נרות</span>
      <span class="candle-time">${fmtTime(nextCandle.iso)}</span>
    </div>`);
  }
  if(nextHavdalah){
    rows.push(`<div class="candle-row">
      <span class="candle-name">צאת השבת</span>
      <span class="candle-time">${fmtTime(nextHavdalah.iso)}</span>
    </div>`);
  }
  el.innerHTML=rows.join("");
}

let bannerIdx=0,bannerTimer=null;
// קח את ה-src של הכתר מהלוגו הראשי (חוסך כפילות base64 ענקית)
function getCrownSrc(){const img=document.querySelector(".crown-img");return img?img.src:"";}
// ── ימי הולדת — התאמת תאריך עברי של היום והפיכה לפריטי באנר ──
function normMonth(m){
  return String(m||"").toLowerCase().replace(/['׳"״\s]/g,"")
    .replace("marcheshvan","cheshvan").replace("heshvan","cheshvan")
    .replace("shevat","shvat").replace("adarii","adar2").replace("adari","adar1");
}
function monthMatches(stored, today){
  const s=normMonth(stored), t=normMonth(today);
  if(s===t) return true;
  // אדר רגיל נחגג באדר ב' בשנה מעוברת
  if(s==="adar" && (t==="adar2"||t==="adar")) return true;
  if(t==="adar" && (s==="adar2"||s==="adar")) return true;
  return false;
}
function todayBirthdayItems(){
  if(!st.hebMonth||!st.hebDay) return [];
  return (st.birthdays||[])
    .filter(b=>b && b.name && Number(b.hday)===Number(st.hebDay) && monthMatches(b.hmonth,st.hebMonth))
    .map(b=>({type:"birthday",title:b.name,text:"מזל טוב ליום ההולדת! עד מאה ועשרים שנה 🎉",active:true}));
}

// ── בדיקת זמן תפילה פעיל לבאנר ──
// משכי זמן: שחרית=45 דק׳, מנחה=18 דק׳, ערבית=18 דק׳
const PRAYER_ALERT_DURATION = {shacharit:45, mincha:18, maariv:18};
const PRAYER_ALERT_NAMES = {shacharit:"שַׁחֲרִית", mincha:"מִנְחָה", maariv:"עַרְבִית"};

function activePrayerAlert(){
  const P = st.prayers||{};
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const k of ["shacharit","mincha","maariv"]){
    const t = P[k];
    if(!t || !/^\d{1,2}:\d{2}$/.test(t)) continue;
    const [hh,mm] = t.split(":").map(Number);
    const startMin = hh*60+mm;
    const dur = PRAYER_ALERT_DURATION[k]||18;
    if(nowMin >= startMin && nowMin < startMin+dur){
      return {key:k, name:PRAYER_ALERT_NAMES[k], time:t};
    }
  }
  return null;
}

function renderBanner(){
  const el = document.getElementById("banner");

  // ── עדיפות ראשונה: זמן תפילה פעיל ──
  const alert = activePrayerAlert();
  if(alert){
    el.classList.add("prayer-alert");
    const logoSrc = getCrownSrc();
    el.innerHTML = `<div class="prayer-alert-inner">
      ${logoSrc ? `<img src="${logoSrc}" class="prayer-alert-logo" alt="לוגו"/>` : ''}
      <span class="prayer-alert-text">אין לדבר בשעת התפילה וקריאת התורה</span>
      ${logoSrc ? `<img src="${logoSrc}" class="prayer-alert-logo" alt="לוגו"/>` : ''}
    </div>`;
    return;
  }
  el.classList.remove("prayer-alert");

  // ── רגיל: תורמים / הודעות / ימי הולדת ──
  const birthdays=todayBirthdayItems();
  const active=[...birthdays,...(st.items||[]).filter(i=>i.active!==false)];
  if(active.length===0){
    // אין הודעות → הצג הוקרה לתורמים כמרקיזה רציפה
    const donors=Array.isArray(st.donors)?st.donors:[];
    if(donors.length){
      if(el.dataset.mode!=="donors"){
        el.dataset.mode="donors";
        const names=donors.map(n=>`<span class="dm-name">${esc(n)}</span><span class="dm-sep">✦</span>`).join("");
        const lead=`<span class="dm-label">הוקרה לתורמי הישיבה</span><span class="dm-sep">✦</span>`;
        const seq=lead+names;
        const dur=Math.max(40,donors.length*4);
        el.innerHTML=`<div class="donor-marquee"><div class="donor-marquee-track" style="animation-duration:${dur}s">${seq}${seq}</div></div>`;
      }
    } else {
      el.dataset.mode=""; el.innerHTML='';
    }
    return;
  }
  el.dataset.mode="items";
  const it=active[bannerIdx%active.length];
  const cat=CATS[it.type]||CATS.announcement;
  const dots=active.map((_,i)=>`<div class="dot ${i===bannerIdx%active.length?"on":""}"></div>`).join("");
  const iconHtml=cat.useCrown
    ? `<img src="${getCrownSrc()}" class="banner-crown" alt="כתר מלכות"/>`
    : `<span class="banner-emoji">${cat.e}</span>`;
  el.innerHTML=`
    ${iconHtml}
    <span class="banner-cat" style="background:${cat.bg};color:${cat.color};border:1px solid ${cat.color}55">${cat.label}</span>
    <div class="banner-content">
      ${it.title?`<span class="banner-title" style="color:${cat.color}">${esc(it.title)}</span>`:""}
      ${it.text?`<span class="banner-body">${esc(it.text)}</span>`:""}
    </div>
    <div class="banner-dots">${dots}</div>`;
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function todayKeyJer(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const o={};p.forEach(x=>o[x.type]=x.value);return o.year+'-'+o.month+'-'+o.day;
}
function hiddenToday(nsKey){ const h=st.hideToday||{}; return h[nsKey]===todayKeyJer(); }

// אודיו — ניגון עם קול (תיקון: הוסר muted מהתגית)
// ════════════════════════════════════════════════════════
// מנגן עם קול. אם הדפדפן חוסם autoplay-עם-קול — מנגן מושתק כדי
// שהווידאו עדיין יוצג, ואז מבטל השתקה אוטומטית בהקדם.
ytEl.muted=false;
ytEl.volume=1;
function playWithAudio(){
  if(!videoActive()){ if(ytEl&&!ytEl.paused) ytEl.pause(); return; }
  ytEl.muted=false; ytEl.volume=1;
  const p=ytEl.play();
  if(p&&p.catch){
    p.catch(()=>{
      // נחסם ניגון עם קול — נגן מושתק כדי לא לאבד את הווידאו
      ytEl.muted=true;
      ytEl.play().catch(()=>{});
    });
  }
}
// במסכי קיוסק עם autoplay-policy מתירני, הקול יעבוד מיד.
// במקרה של חסימה — אינטראקציה ראשונה (מגע/לחיצה) תפעיל קול.
function unmuteAndHide(){
  if(!videoActive()) { document.getElementById("unmute-btn").classList.remove("visible"); return; }
  ytEl.muted=false; ytEl.volume=1;
  ytEl.play().catch(()=>{});
  document.getElementById("unmute-btn").classList.remove("visible");
}
function enableAudioOnce(){
  if(videoActive()){
    ytEl.muted=false; ytEl.volume=1;
    const p=ytEl.play();
    if(p&&p.catch) p.catch(()=>{
      // קול נחסם — הצג כפתור
      document.getElementById("unmute-btn").classList.add("visible");
    });
  }
  ["click","touchstart","keydown"].forEach(ev=>document.removeEventListener(ev,enableAudioOnce));
}
["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,enableAudioOnce));

// ════════════════════════════════════════════════════════
// כיבוי הווידאו לכבוד התפילה — רבע שעה לפני שחרית/מנחה/ערבית
// ════════════════════════════════════════════════════════
const PRAYER_OFF_BEFORE=15;  // דקות לפני זמן התפילה
const PRAYER_OFF_AFTER=20;   // דקות אחרי תחילת התפילה (משך הכיסוי)
const PRAYER_NAMES={shacharit:"שחרית",mincha:"מנחה",maariv:"ערבית"};
let videoPausedForPrayer=false;
function prayerOffWindow(){
  if(!st.videoOffBeforePrayer) return null;
  const P=st.prayers||{};
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  for(const k of ["shacharit","mincha","maariv"]){
    const t=P[k];
    if(!t||!/^\d{1,2}:\d{2}$/.test(t)) continue;
    const [hh,mm]=t.split(":").map(Number);
    const pm=hh*60+mm;
    if(nowMin>=pm-PRAYER_OFF_BEFORE && nowMin<pm+PRAYER_OFF_AFTER) return {name:PRAYER_NAMES[k],time:t};
  }
  return null;
}
// זמני צפייה: הווידאו פועל אך ורק בתוך טווח שהוגדר ע"י הגבאי.
// אם לא הוגדר אף טווח — מחזיר false (ברירת מחדל: הווידאו לא פועל).
function inViewingWindow(){
  const w=st.viewingWindows;
  if(!Array.isArray(w)||!w.length) return false;
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  for(const win of w){
    if(!win||!/^\d{1,2}:\d{2}$/.test(win.start||"")||!/^\d{1,2}:\d{2}$/.test(win.end||"")) continue;
    const [sh,sm]=win.start.split(":").map(Number);
    const [eh,em]=win.end.split(":").map(Number);
    let s=sh*60+sm, e=eh*60+em;
    if(e<=s){ // טווח שחוצה חצות
      if(nowMin>=s || nowMin<e) return true;
    }else{
      if(nowMin>=s && nowMin<e) return true;
    }
  }
  return false;
}
// הווידאו פעיל רק אם אנו בתוך זמן צפייה וגם לא בזמן תפילה.
function videoActive(){ return inViewingWindow() && !prayerOffWindow(); }

// ── גלריית תמונות הרבי ──
// תמונות מובנות + תמונות מותאמות אישית מה-admin
const BUILTIN_PHOTOS = [
  {
    src: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Menachem_Mendel_Schneerson.jpg/440px-Menachem_Mendel_Schneerson.jpg",
    caption: "הרבי מליובאוויטש מלך המשיח שליט״א"
  },
  {
    src: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Lubavitcher_Rebbe_Menachem_Mendel_Schneerson.jpg/440px-Lubavitcher_Rebbe_Menachem_Mendel_Schneerson.jpg",
    caption: "הרבי מליובאוויטש שליט״א — יחי אדוננו"
  },
  {
    src: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Menachem_Mendel_Schneerson_1987.jpg/440px-Menachem_Mendel_Schneerson_1987.jpg",
    caption: "הרבי — תשמ״ז"
  }
];

let galleryIndex = 0;
let galleryTimer = null;

function getGalleryPhotos(){
  // תמונות מובנות שנבחרו + תמונות ידניות
  const sel = (st.gallerySelected || []);
  const custom = (st.galleryCustom || []);
  let photos = [];
  if(sel.length === 0){
    // ברירת מחדל — כל התמונות המובנות
    photos = [...BUILTIN_PHOTOS];
  } else {
    photos = BUILTIN_PHOTOS.filter((_,i) => sel.includes(i));
  }
  // הוסף תמונות ידניות
  custom.forEach(c => { if(c.src) photos.push({src:c.src, caption:c.caption||''}); });
  return photos.length ? photos : [...BUILTIN_PHOTOS];
}

function showGalleryPhoto(idx){
  const photos = getGalleryPhotos();
  if(!photos.length) return;
  const p = photos[idx % photos.length];
  const img = document.getElementById('gallery-img');
  const cap = document.getElementById('gallery-caption');
  if(img){ 
    img.onerror = null; // מנע לולאה
    img.src = p.src; 
    img.onerror = () => { 
      img.onerror = null;
      img.src = ''; 
      img.style.display='none';
    }; 
  }
  if(cap){ cap.textContent = p.caption || ''; }
}

function startGallery(){
  const gallery = document.getElementById('rebbe-gallery');
  if(!gallery) return;
  gallery.classList.add('active');
  showGalleryPhoto(galleryIndex);
  const interval = (st.galleryInterval || 3) * 60 * 1000; // דקות → ms
  clearInterval(galleryTimer);
  galleryTimer = setInterval(() => {
    galleryIndex = (galleryIndex + 1) % getGalleryPhotos().length;
    showGalleryPhoto(galleryIndex);
  }, interval);
}

function stopGallery(){
  const gallery = document.getElementById('rebbe-gallery');
  if(gallery) gallery.classList.remove('active');
  clearInterval(galleryTimer);
}

function applyVideoCover(){
  const cover=document.getElementById("video-cover");
  if(!videoActive()){
    if(cover) cover.style.display="none";
    startGallery();
    if(ytEl && !ytEl.paused){ ytEl.pause(); }
    videoPausedForPrayer=true;
  }else{
    if(cover) cover.style.display="none";
    stopGallery();
    if(videoPausedForPrayer){ videoPausedForPrayer=false; playWithAudio(); }
  }
}
setInterval(applyVideoCover,15000);

let stallTimer=null;
function clearStallTimer(){ if(stallTimer){ clearTimeout(stallTimer); stallTimer=null; } }
function armStallTimer(){
  clearStallTimer();
  // אם הסרטון תקוע מעל 15 שניות — עבור לבא
  stallTimer=setTimeout(()=>{
    console.warn("video stalled too long, skipping");
    playVidAt(vidIdx+1);
  },15000);
}

function vidList(){
  if(st.videoUrl && st.videoUrl.trim()) return [{url:st.videoUrl,title:st.videoTitle||""}];
  return Array.isArray(st.playlist)?st.playlist.filter(v=>v&&v.url):[];
}
function encURL(u){ try{return encodeURI(decodeURI(u));}catch(e){return u;} }
function playVidAt(i){
  clearStallTimer();
  const list=vidList();
  if(!list.length){ ytEl.removeAttribute("src"); ytEl.load&&ytEl.load(); return; }
  vidIdx=((i%list.length)+list.length)%list.length;
  ytEl.src=encURL(list[vidIdx].url);
  ytEl.load();
  playWithAudio();
}
function syncVideo(){
  if(!videoActive()){ if(ytEl&&!ytEl.paused) ytEl.pause(); applyVideoCover(); return; }
  const list=vidList();
  const sig=list.map(v=>v.url).join("|");
  if(sig!==curSig){ curSig=sig; vidIdx=0; playVidAt(0); }
  else if(list.length && ytEl.paused && ytEl.readyState>=2){ playWithAudio(); }
}

// מעבר אוטומטי בסוף הסרטון
ytEl.addEventListener("ended",()=>playVidAt(vidIdx+1));

// שגיאות נטענות: דלג לבא עם השהיה קצרה
ytEl.addEventListener("error",()=>{
  clearStallTimer();
  if(vidList().length>1) setTimeout(()=>playVidAt(vidIdx+1),1500);
});

// תקיעה / חוסר בנתונים: התחל טיימר 15 שניות לדילוג, בטל אם הניגון חודש
ytEl.addEventListener("stalled",armStallTimer);
ytEl.addEventListener("waiting",armStallTimer);
ytEl.addEventListener("playing",clearStallTimer);
ytEl.addEventListener("canplay",clearStallTimer);

// כשיש מספיק נתונים בבאפר — נסה לנגן (יעזור עם sandbox restrictions)
ytEl.addEventListener("loadeddata",()=>{ if(ytEl.paused) playWithAudio(); });

function renderDynamic(){
  renderClock(); // refresh Hebrew date display
  document.getElementById("parasha").textContent=st.parasha||"...";
  document.getElementById("haftarah").textContent=st.haftarah||"";
  // עדיפות תצוגה: סרטון ידני (torah) שמסומן ע"י המנהל גובר; אחרת היום יום אוטומטי
  const dailyText = (st.torah && st.torah !== D_TORAH) ? st.torah : (st.hayomYom || st.torah);
  document.getElementById("torah-text").textContent = dailyText;
  // הפתגם היומי בעניני משיח וגאולה — שורה מתחת להיום יום (רק אם הוזן)
  const pl=document.getElementById("pithgam-line"), pb=document.getElementById("pithgam-body");
  if(pl&&pb){
    const txt=(st.pithgam||"").trim();
    if(txt){ pb.textContent=txt; pl.style.display="flex"; }
    else { pl.style.display="none"; }
  }
  // תאריך עברי של היום יום — מוצג בכותרת. אם יש URL מ-chabadpedia, חלץ ממנו
  const hdEl=document.getElementById("hayomyom-date");
  if(hdEl){
    let hd="";
    if(st.hayomYomSource){
      // ה-URL הוא ".../תבנית:היום_יום/י%22ג_סיון" — חלץ את התאריך
      try{
        const m=decodeURIComponent(st.hayomYomSource).match(/היום[\s_]יום\/([^?&#]+)/);
        if(m) hd=m[1].replace(/_/g," ");
      }catch(e){}
    }
    if(!hd) hd=st.hebDate||"";
    hdEl.textContent=hd;
  }
  syncVideo();
  applyVideoCover();
  renderZmanim();
  renderPrayers();
  renderCandle();
  renderDedicationBoxes();
  renderDonorStrip();
  renderBanner();
  renderLearning();
  applySectionVisibility();
}

// הצגה/הסתרה של בלוקים שלמים על המסך לפי בחירת הגבאי
function applySectionVisibility(){
  const v = st.sectionsVisible || {};
  const hide = (key) => (v[key]===false) || hiddenToday('s:'+key);
  const show = (key, el) => { if(el) el.style.display = hide(key) ? 'none' : ''; };
  show('roshChodesh', document.getElementById('rosh-chodesh-banner'));
  // ראש חודש מיוחד: מוצג רק אם גם פעיל וגם רלוונטי (renderRoshChodesh מוסיף class visible)
  const rc = document.getElementById('rosh-chodesh-banner');
  if(rc && hide('roshChodesh')) rc.style.display='none';
  show('parasha', document.getElementById('sec-parasha'));
  const hl=document.getElementById('haftarah-lbl'), hf=document.getElementById('haftarah');
  if(hl) hl.style.display=hide('haftarah')?'none':'';
  if(hf) hf.style.display=hide('haftarah')?'none':'';
  show('zmanim', document.getElementById('zmanim-list'));
  show('zmanim', document.getElementById('sec-zmanim-title'));
  show('candle', document.getElementById('candle-list'));
  show('learning', document.getElementById('sec-learning'));
  show('hayomyom', document.getElementById('sec-hayomyom'));
  show('prayers', document.getElementById('prayers'));
  show('video', document.getElementById('sec-video'));
  show('donors', document.getElementById('banner'));
  show('memorial', document.getElementById('memorial-box'));
  // הפתגם היומי — שורה בתוך אזור היום יום, נשלטת בנפרד
  const plg=document.getElementById('pithgam-line');
  if(plg && hide('pithgam')) plg.style.display='none';
  // חסויות (יומי/שבועי) — אזור צד ימין
  const ss=document.getElementById('sponsor-stack');
  if(ss) ss.style.display=hide('sponsors')?'none':'';
}

function setStatus(type,msg){
  const el=document.getElementById("status");
  el.className="status "+type;
  el.textContent=msg;
}

// DAILY LEARNING (מ-chabad.org.il דרך השרת המקומי)
// ════════════════════════════════════════════════════════
// סדר התצוגה של הלימוד היומי (תואם את 6 המקורות בשרת)
// היום יום אינו ברשימה — הוא מוצג בפאנל נפרד בתחתית
const LEARNING_ORDER = [
  {key:'chumash',  label:'חומש'},
  {key:'tehillim', label:'תהילים'},
  {key:'tanya',    label:'תניא'},
  {key:'rambam3',  label:'רמב״ם ג׳ פרקים'},
  {key:'rambam1',  label:'רמב״ם פרק ליום'},
  {key:'mitzvot',  label:'ספר המצוות'},
];

function renderLearning(){
  const el=document.getElementById("learning-list");
  if(!el) return;
  const dl=st.dailyLearning||{};
  const ov=st.dailyLearningOverrides||{};
  const vis=st.learningVisible||{};
  const html=LEARNING_ORDER.filter(L=>vis[L.key]!==false && !hiddenToday('l:'+L.key)).map(L=>{
    let val='<span class="learning-loading">טוען...</span>';
    // עדיפות: override ידני > ערך אוטומטי
    if(ov[L.key] && String(ov[L.key]).trim()){
      val=esc(String(ov[L.key]).trim());
    } else {
      const item=dl[L.key];
      if(item){
        if(item.error) val='<span style="opacity:.5">לא זמין</span>';
        else if(item.ref){
          let ref=item.ref;
          // התאמת שם הפרשה בלימוד החומש לפרשה שבכותרת (לוח א"י), עם שמירת שם העלייה.
          if(L.key==='chumash' && st.parasha){
            const pName=st.parasha.replace(/^פרשת\s+/,'').trim();
            const m=ref.match(/[—\-]\s*([^—\-]+)\s*$/); // שם העלייה אחרי המקף
            const aliyah=m?m[1].trim():'';
            ref=aliyah?`${pName} — ${aliyah}`:pName;
          }
          val=esc(ref);
        }
        else val='—';
      }
    }
    return `<div class="learning-item">
      <div class="learning-lbl">${L.label}</div>
      <div class="learning-val">${val}</div>
    </div>`;
  }).join("");
  el.innerHTML=html;
}
